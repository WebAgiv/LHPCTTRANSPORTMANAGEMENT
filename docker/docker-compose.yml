version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: aitrc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: aitrc_transport_erp
      MYSQL_USER: aitrc_user
      MYSQL_PASSWORD: aitrc_password_2025
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: aitrc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: aitrc_user
      DB_PASSWORD: aitrc_password_2025
      DB_NAME: aitrc_transport_erp
      JWT_SECRET: change_this_to_64_char_random_string_in_production
      JWT_REFRESH_SECRET: change_this_to_another_64_char_random_string
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
